<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root { --primary: #2c3e50; --breakout: #c0392b; --bg: #cbd5e1; }
    body { font-family: 'Segoe UI', sans-serif; padding: 40px 20px; background-color: var(--bg); margin: 0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    
    /* Expanded max-width for Laptop Layout */
    .screen { display: none; width: 100%; max-width: 850px; background: #f8fafc; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); text-align: center; }
    .screen-main-layout { text-align: left; }
    .active { display: block; }
    
    .header { color: white; padding: 15px; text-align: center; font-weight: bold; margin-bottom: 20px; border-radius: 6px; font-size: 1.2em; letter-spacing: 1px; }
    .header-tt { background: var(--primary); }
    .header-bo { background: var(--breakout); }
    
    /* Two-Column CSS Grid Layout */
    .two-col-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: stretch; margin-bottom: 15px; }
    
    .sidebar-panel { background: white; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; max-height: 450px; }
    .main-panel { display: flex; flex-direction: column; }
    
    .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; height: 100%; display: flex; flex-direction: column; justify-content: center; }
    .test-title { font-weight: bold; font-size: 1.2em; margin-bottom: 20px; color: #1e293b; line-height: 1.4; }
    
    /* Vertical Timeline CSS */
    .breadcrumb-vertical { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex-grow: 1; padding-right: 10px; }
    .breadcrumb-vertical::-webkit-scrollbar { width: 6px; }
    .breadcrumb-vertical::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    .breadcrumb-item { font-size: 0.85em; background: #f1f5f9; padding: 10px; border-radius: 6px; border-left: 4px solid #94a3b8; transition: 0.2s; }
    .breadcrumb-item.current { border-left-color: var(--breakout); background: #fef2f2; font-weight: bold; border-left-width: 6px;}
    .breadcrumb-item.current-tt { border-left-color: var(--primary); background: #f0f9ff; font-weight: bold; border-left-width: 6px;}
    
    .btn-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { padding: 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1.05em; transition: 0.15s; text-transform: uppercase; letter-spacing: 0.5px; }
    button:active { transform: scale(0.98); }
    
    .btn-fn { background-color: #10b981; color: white; }
    .btn-dn { background-color: #f59e0b; color: white; }
    .btn-dp { background-color: #ea580c; color: white; }
    .btn-fp { background-color: #ef4444; color: white; }
    .btn-back { background-color: #94a3b8; color: white; margin-top: 15px; width: 100%; font-size: 0.9em; padding: 12px;}
    
    .diag-box { background: #fef2f2; border-left: 6px solid var(--breakout); padding: 15px; margin-bottom: 15px; display: none; border-radius: 0 6px 6px 0; text-align: left;}
    .diag-text { color: var(--breakout); font-weight: bold; margin: 0; font-size: 1em; line-height: 1.4; }

    /* Success Screen Specifics */
    .success-icon { font-size: 3em; margin-bottom: 10px; }
    .btn-pdf { background-color: #3b82f6; color: white; margin-bottom: 10px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px;}
    .btn-pdf-program { background-color: #16a085; color: white; margin-bottom: 20px; width: 100%; }
    .btn-restart { background-color: #cbd5e1; color: #334155; width: 100%; }
    
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Mobile Fallback */
    @media (max-width: 700px) {
      .two-col-layout { grid-template-columns: 1fr; }
      .sidebar-panel { max-height: 200px; }
    }
  </style>
</head>
<body>

  <div id="screen-client" class="screen active" style="max-width: 550px;">
    <div class="header header-tt">SFMA CLINICAL INTAKE</div>
    <div class="card"><input type="text" id="client-name" placeholder="Patient Full Name" style="width:90%; padding:14px; border:1px solid #ccc; border-radius:6px; font-size:1.05em;"></div>
    <button class="btn-fn" style="width:100%" onclick="initTT()">START ASSESSMENT</button>
  </div>

  <div id="screen-main" class="screen screen-main-layout">
    <div id="ui-header" class="header"></div>
    <div id="diag-container" class="diag-box"><p id="diag-output" class="diag-text"></p></div>
    
    <div class="two-col-layout">
      
      <div class="sidebar-panel">
        <div id="display-pattern" style="font-size:0.85em; color:#7f8c8d; font-weight:bold; margin-bottom:12px; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;"></div>
        <div id="breadcrumb-trail" class="breadcrumb-vertical"></div>
      </div>

      <div class="main-panel">
        <div class="card">
          <div style="font-size:0.85em; color:#94a3b8; font-weight:bold; margin-bottom:8px; text-transform: uppercase;">Current Assessment:</div>
          <div id="display-test" class="test-title"></div>
          <div class="btn-container">
            <button class="btn-fn" onclick="handleInput('FN')">FN</button>
            <button class="btn-dn" onclick="handleInput('DN')">DN</button>
            <button class="btn-dp" onclick="handleInput('DP')">DP</button>
            <button class="btn-fp" onclick="handleInput('FP')">FP</button>
          </div>
        </div>
      </div>

    </div>
    
    <button id="back-btn" class="btn-back" onclick="goBack()">← BACK (UNDO LAST)</button>
  </div>

  <div id="screen-loading" class="screen" style="max-width: 550px;">
    <div class="header header-tt" style="background: #34495e;">COMPILING REPORTS</div>
    <p style="color: #475569; font-weight: bold; margin-top: 20px;">Analyzing clinical pathways and generating PDFs...</p>
    <div class="loader"></div>
  </div>

  <div id="screen-success" class="screen" style="max-width: 550px;">
    <div class="success-icon">✅</div>
    <h2 style="color: #1e293b; margin-top: 0;">Assessment Complete</h2>
    <p style="color: #64748b; margin-bottom: 25px;">Your clinical reports have been compiled and securely saved to the database. You can download the PDFs below.</p>
    <button class="btn-pdf" id="btn-download-audit">📄 Download Clinical Audit (PDF)</button>
    <button class="btn-pdf-program" id="btn-download-program">📄 Download Prescribed Program (PDF)</button>
    <button class="btn-restart" onclick="location.reload()">Start New Patient</button>
  </div>

    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function initTT() {
      state.client = document.getElementById('client-name').value;
      if (!state.client) return alert("Patient Name Required");
      state.resultsLog = []; state.boQueue = []; state.ttIndex = 0; state.mode = "TT";
      show('screen-main');
      updateUI();
    }

    function saveState() { historyStack.push(JSON.parse(JSON.stringify(state))); if (historyStack.length > 40) historyStack.shift(); }
    
    function goBack() { 
      if (historyStack.length > 0) { 
        state = historyStack.pop(); 
        document.getElementById('diag-container').style.display = 'none'; 
        updateUI(); 
      } 
    }

    const scoreColor = (s) => s === 'FN' ? '#10b981' : (s.includes('P') ? '#ef4444' : '#f59e0b');

    function updateUI() {
      const header = document.getElementById('ui-header');
      const testTitle = document.getElementById('display-test');
      const patternLabel = document.getElementById('display-pattern');
      const breadcrumb = document.getElementById('breadcrumb-trail');

      let trailHTML = "";

      if (state.mode === "TT") {
        header.className = "header header-tt"; header.innerText = "TOP TIER SCREENING";
        state.currentTest = TT_ORDER[state.ttIndex]; testTitle.innerText = state.currentTest; patternLabel.innerText = "Global Scan Sequence";
        
        let historySet = state.resultsLog.filter(r => r.phase === "TOP TIER");
        historySet.forEach(r => {
          trailHTML += `<div class="breadcrumb-item"><span style="color:#64748b; display:block; margin-bottom:4px;">${r.test}</span><b style="color:${scoreColor(r.score)}">${r.score}</b></div>`;
        });
        trailHTML += `<div class="breadcrumb-item current-tt"><span style="color:#1e293b; display:block;">Current Scan</span></div>`;

      } else {
        header.className = "header header-bo"; header.innerText = "BREAKOUT AUDIT";
        patternLabel.innerText = state.activePattern + " Sequence"; testTitle.innerText = state.currentTest;
        
        let historySet = state.resultsLog.filter(r => r.phase === "BREAKOUT" && r.pattern === state.activePattern);
        historySet.forEach(r => {
          trailHTML += `<div class="breadcrumb-item"><span style="color:#64748b; display:block; margin-bottom:4px;">${r.test}</span><b style="color:${scoreColor(r.score)}">${r.score}</b></div>`;
        });
        trailHTML += `<div class="breadcrumb-item current"><span style="color:#1e293b; display:block;">Current Step</span></div>`;
      }
      
      breadcrumb.innerHTML = trailHTML;
      setTimeout(() => breadcrumb.scrollTop = breadcrumb.scrollHeight, 50);
    }

    function handleInput(score) {
      saveState();
      if (state.mode === "TT") {
        state.resultsLog.push({ phase: "TOP TIER", pattern: state.currentTest, test: state.currentTest, score: score });
        if (score !== "FN") state.boQueue.push(state.currentTest);
        state.ttIndex++;
        if (state.ttIndex < TT_ORDER.length) updateUI(); else startBreakouts();
      } else { processBreakout(score); }
    }

    function startBreakouts() { if (state.boQueue.length === 0) return finishAssessment(); state.mode = "BO"; nextPattern(); }

    function nextPattern() {
      if (state.boQueue.length === 0) return finishAssessment();
      state.activePattern = state.boQueue.shift();
      let key = state.activePattern;
      
      if (key.includes("Cervical Rotation")) key = "Cervical Rotation";
      if (key.includes("SLS")) key = "SLS";
      
      state.currentTest = SFMA_LOGIC[key].start;
      document.getElementById('diag-container').style.display = 'none';
      updateUI();
    }

    function processBreakout(score) {
      let key = state.activePattern;
      
      if (key.includes("Cervical Rotation")) key = "Cervical Rotation";
      if (key.includes("SLS")) key = "SLS";
      if (key.includes("Flow")) key = key;

      const node = SFMA_LOGIC[key].nodes[state.currentTest];
      const branch = node[score] || node["any"];

      if (branch.diag) {
        document.getElementById('diag-container').style.display = 'block';
        document.getElementById('diag-output').innerText = branch.diag;
        state.resultsLog.push({ phase: "BREAKOUT", pattern: state.activePattern, test: state.currentTest, score: score, diag: branch.diag });
      } else { state.resultsLog.push({ phase: "BREAKOUT", pattern: state.activePattern, test: state.currentTest, score: score }); }

      let nextTarget = branch.next;

      function resolveNext(target) {
        if (target && target.startsWith("CHECK_")) {
          let parts = target.split("|"); 
          let testToCheck = parts[0].replace("CHECK_", "");
          let ifFailed = parts[1];
          let ifPassed = parts[2];
          
          let logEntry = state.resultsLog.find(r => r.test === testToCheck);
          if (logEntry && logEntry.score !== "FN") return resolveNext(ifFailed);
          else return resolveNext(ifPassed);
        }
        return target;
      }

      nextTarget = resolveNext(nextTarget);

      if (nextTarget === "EXIT") { setTimeout(nextPattern, 1200); }
      else if (nextTarget.includes("Flow")) { state.activePattern = nextTarget; state.currentTest = SFMA_LOGIC[nextTarget].start; setTimeout(updateUI, 500); }
      else { state.currentTest = nextTarget; setTimeout(updateUI, 500); }
    }

    function finishAssessment() {
      show('screen-loading');
      google.script.run
        .withSuccessHandler((pdfUrls) => { 
          show('screen-success');
          document.getElementById('btn-download-audit').onclick = () => window.open(pdfUrls.auditUrl, '_blank');
          document.getElementById('btn-download-program').onclick = () => window.open(pdfUrls.programUrl, '_blank');
        })
        .withFailureHandler((error) => {
          alert("Google encountered an error generating the PDFs: " + error.message);
          show('screen-main'); 
        })
        .processAssessment(state.client, state.resultsLog);
    }
  </script>
